<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReCEPtor</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center"
    style="min-height: 100vh"
  >
    <main
      class="container shadow-sm p-4 bg-white rounded"
      style="max-width: 540px"
    >
      <div class="text-center mb-4">
        <h1 class="text-primary fw-bold">ReCEPtor</h1>
        <p class="text-muted">
          Sua busca rápida de endereços em poucos segundos.
        </p>
      </div>

      <div class="input-group mb-3">
        <input
          type="text"
          inputmode="numeric"
          id="input-cep"
          class="form-control form-control-lg"
          placeholder="Digite o CEP (8 dígitos)"
          maxlength="8"
          autofocus
        />
        <button id="btn-buscar" class="btn btn-primary btn-lg" type="button">
          Buscar CEP
        </button>
      </div>

      <div id="mensagem-status" class="alert d-none" role="status"></div>

      <section id="area-resultado" class="card mt-4 d-none">
        <div class="card-body">
          <div class="mb-4">
            <p class="mb-1">
              <strong>CEP:</strong> <span id="resultado-cep"></span>
            </p>
            <p class="mb-1">
              <strong>Rua:</strong> <span id="resultado-rua"></span>
            </p>
            <p class="mb-1">
              <strong>Cidade:</strong> <span id="resultado-cidade"></span>
            </p>
            <p class="mb-0">
              <strong>Estado:</strong> <span id="resultado-estado"></span>
            </p>
          </div>

          <div class="d-flex gap-2 justify-content-center">
            <button id="btn-copiar" class="btn btn-success" type="button">
              Copiar tudo
            </button>
            <button
              id="btn-nova-busca"
              class="btn btn-outline-primary"
              type="button"
            >
              Nova busca
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
